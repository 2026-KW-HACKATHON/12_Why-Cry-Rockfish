<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실거주 아카이브</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-2: #e3e9ef;
    --ink: #1b232e;
    --ink-muted: #5b6675;
    --accent: #c96a1f;
    --accent-strong: #a4551a;
    --accent-soft: #fae3ca;
    --line: #d7dee6;
    --ok: #2f7a54;
    --ok-soft: #dcefe3;
    --warn: #b3495a;
    --warn-soft: #f7dde1;
    --shadow: 0 1px 2px rgba(27,35,46,0.05), 0 8px 24px -14px rgba(27,35,46,0.25);
    --scrim: rgba(255,255,255,0.8);
    font-size: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161d; --surface: #171f29; --surface-2: #1d2630;
      --ink: #e8edf3; --ink-muted: #96a3b2;
      --accent: #f0964b; --accent-strong: #ffb578; --accent-soft: #3a2a1a;
      --line: #2a333e;
      --ok: #57b586; --ok-soft: #1c3327;
      --warn: #e57e8b; --warn-soft: #3a232a;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 28px -14px rgba(0,0,0,0.6);
      --scrim: rgba(16,22,29,0.82);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10161d; --surface: #171f29; --surface-2: #1d2630;
    --ink: #e8edf3; --ink-muted: #96a3b2;
    --accent: #f0964b; --accent-strong: #ffb578; --accent-soft: #3a2a1a;
    --line: #2a333e;
    --ok: #57b586; --ok-soft: #1c3327;
    --warn: #e57e8b; --warn-soft: #3a232a;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 28px -14px rgba(0,0,0,0.6);
    --scrim: rgba(16,22,29,0.82);
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    color: var(--ink);
    font-family: 'IBM Plex Sans KR', 'Noto Sans KR', sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  h1, h2, h3 { font-family: 'Gowun Batang', 'Noto Serif KR', serif; font-weight: 700; text-wrap: balance; margin: 0; }

  /* ---- shell ---- */
  header.topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding-block: 12px;
  }
  .topbar-inner, .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding-inline: 20px;
  }
  .topbar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand { font-family: 'Gowun Batang', serif; font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .brand .dot { color: var(--accent); }
  .brand-fish { width: 30px; height: 30px; flex: none; }
  .nav-actions { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: 9px;
    padding: 9px 16px;
    font-size: 0.88rem;
    font-weight: 600;
    border: 1px solid var(--line);
    background: var(--surface);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-muted); padding-inline: 6px; }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  main { padding-block: 28px 72px; }

  /* ---- intro strip ---- */
  .intro {
    padding: 18px 0 6px;
    color: var(--ink-muted);
    font-size: 0.94rem;
  }
  .intro b { color: var(--ink); font-weight: 600; }

  /* ---- search ---- */
  .search-row {
    margin-top: 16px;
    display: flex;
    gap: 8px;
  }
  .search-row input[type="text"] {
    flex: 1;
    padding: 11px 14px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .search-row select {
    padding: 11px 10px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .search-row input:focus, .search-row select:focus,
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---- building list ---- */
  .b-list { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .b-card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    box-shadow: var(--shadow);
  }
  .b-card-row { display: flex; gap: 14px; align-items: stretch; }
  .b-thumb {
    flex: none;
    width: 108px;
    aspect-ratio: 16 / 10;
    border-radius: 9px;
    overflow: hidden;
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .b-thumb svg, .b-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .b-card-main { flex: 1; min-width: 0; padding: 2px 4px 2px 0; }
  .b-card .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .b-card .name { font-weight: 600; font-size: 1.02rem; }
  .b-card .addr { color: var(--ink-muted); font-size: 0.85rem; margin-top: 3px; }
  .price-line { margin-top: 8px; font-weight: 700; font-size: 0.98rem; color: var(--accent-strong); font-family: 'IBM Plex Mono', monospace; }
  .tag {
    font-size: 0.7rem; font-weight: 600;
    padding: 3px 9px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent-strong);
    white-space: nowrap;
  }
  .b-card .meta { margin-top: 8px; display: flex; gap: 14px; font-size: 0.78rem; color: var(--ink-muted); }
  .b-hero {
    margin-top: 16px;
    width: 100%;
    aspect-ratio: 16 / 7;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .b-hero svg, .b-hero img { display: block; width: 100%; height: 100%; object-fit: cover; }

  .empty {
    margin-top: 28px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 36px 20px;
    text-align: center;
    color: var(--ink-muted);
  }
  .empty .btn { margin-top: 14px; }

  .banner {
    margin-top: 14px;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.86rem;
    background: var(--surface-2);
    color: var(--ink-muted);
    border: 1px solid var(--line);
  }

  /* ---- detail ---- */
  .back-link { font-size: 0.86rem; color: var(--ink-muted); display: inline-flex; align-items: center; gap: 4px; }
  .b-head { margin-top: 14px; }
  .b-head .addr { color: var(--ink-muted); margin-top: 6px; font-size: 0.94rem; }
  .b-head h2 { font-size: 1.7rem; }
  .stat-row {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat .k { font-size: 0.72rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .v { margin-top: 4px; font-weight: 600; font-size: 1.02rem; }

  .section-h {
    margin-top: 30px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    flex-wrap: wrap;
  }
  .section-h h3 { font-size: 1.1rem; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; }

  .r-list { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
  .r-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .r-card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .r-card .when { font-size: 0.76rem; color: var(--ink-muted); }
  .r-grid {
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px 16px;
    font-size: 0.87rem;
  }
  .r-grid .k { color: var(--ink-muted); }
  .r-grid .v { font-weight: 500; }
  .chip-row { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 0.74rem; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-muted); border: 1px solid var(--line); }
  .chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .r-note { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 0.87rem; color: var(--ink); }

  /* ---- give-to-get detail lock ---- */
  .lock-banner {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .lock-banner-icon { font-size: 1.7rem; flex: none; line-height: 1; }
  .lock-banner-text { flex: 1; min-width: 200px; font-size: 0.86rem; color: var(--ink); }
  .lock-banner-text b { color: var(--accent-strong); }
  .lock-banner .btn { flex: none; }
  .locked-wrap { position: relative; margin-top: 4px; border-radius: 10px; overflow: hidden; }
  .locked-blur { filter: blur(6px); user-select: none; pointer-events: none; }
  .lock-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    padding: 10px;
    text-align: center;
    background: var(--scrim);
    border-radius: 10px;
  }
  .lock-overlay span { font-size: 0.8rem; font-weight: 600; color: var(--ink-muted); }
  .lock-overlay .btn { padding: 7px 14px; font-size: 0.8rem; }
  .unlocked-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.74rem; font-weight: 600;
    padding: 6px 10px; border-radius: 999px;
    background: var(--ok-soft); color: var(--ok);
    white-space: nowrap;
  }
  .unlocked-badge[hidden] { display: none; }

  /* ---- form ---- */
  form { margin-top: 8px; }
  fieldset {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px 20px;
    margin: 0 0 16px;
  }
  legend { font-weight: 600; font-size: 0.9rem; padding: 0 6px; color: var(--accent-strong); }
  .field { margin-top: 14px; }
  .field:first-child { margin-top: 0; }
  .field label.main { display: block; font-size: 0.86rem; font-weight: 600; margin-bottom: 6px; }
  .field .hint { font-size: 0.76rem; color: var(--ink-muted); margin-top: 4px; }
  .field input[type="text"], .field input[type="number"], .field select, .field textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .field textarea { min-height: 80px; resize: vertical; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .addr-row { display: flex; gap: 8px; }
  .addr-row input { flex: 1; min-width: 0; }
  .addr-row .btn { flex-shrink: 0; white-space: nowrap; padding: 0 14px; }
  #addr-dup-hint { margin-top: 8px; padding: 10px; border-radius: 9px; background: var(--accent-soft); border: 1px solid var(--accent); font-size: 0.85rem; }
  #addr-dup-hint .dup-item { display: block; width: 100%; text-align: left; margin-top: 6px; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--accent); background: var(--surface); cursor: pointer; font-size: 0.85rem; }
  .check-grid { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 4px; }
  .check-grid label { display: inline-flex; align-items: center; gap: 6px; font-size: 0.86rem; }
  .mode-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .mode-toggle button {
    flex: 1; padding: 10px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--surface); font-size: 0.86rem; font-weight: 600; cursor: pointer;
    color: var(--ink-muted);
  }
  .mode-toggle button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
  .search-pick { position: relative; }
  .pick-results {
    margin-top: 6px;
    border: 1px solid var(--line);
    border-radius: 9px;
    max-height: 220px;
    overflow-y: auto;
    background: var(--surface);
  }
  .pick-item { padding: 10px 12px; font-size: 0.86rem; cursor: pointer; border-bottom: 1px solid var(--line); }
  .pick-item:last-child { border-bottom: none; }
  .pick-item:hover { background: var(--surface-2); }
  .pick-item .a { color: var(--ink-muted); font-size: 0.78rem; }
  .picked-box {
    margin-top: 8px;
    display: flex; justify-content: space-between; align-items: center;
    background: var(--accent-soft); color: var(--accent-strong);
    border-radius: 9px; padding: 10px 14px; font-size: 0.86rem; font-weight: 600;
  }
  .picked-box button { background: none; border: none; color: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; font-size: 0.8rem; }

  .submit-bar { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
  .field-error { color: var(--warn); font-size: 0.78rem; margin-top: 5px; }

  /* ---- toast ---- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--bg);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 0.86rem;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 50;
    max-width: calc(100% - 40px);
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 560px) {
    .two-col { grid-template-columns: 1fr; }
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    .r-grid { grid-template-columns: 1fr 1fr; }
    .b-thumb { width: 78px; }
  }

  /* ---- home hero ---- */
  .home-hero {
    position: relative;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    margin-top: -28px;
    overflow: hidden;
    color: #fff;
    min-height: 360px;
  }
  @media (min-width: 560px) {
    .home-hero { min-height: 460px; }
  }
  .home-hero-bg { position: absolute; inset: 0; z-index: 0; line-height: 0; }
  .home-hero-bg svg, .home-hero-bg img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .home-hero-scrim {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(8,12,10,0.05) 0%, rgba(8,12,10,0.12) 40%, rgba(8,12,10,0.55) 100%);
  }
  .home-hero-inner {
    position: absolute; inset: 0; z-index: 2;
    max-width: 780px; margin: 0 auto;
    padding: 20px 20px 30px;
    display: flex; flex-direction: column; justify-content: flex-end;
    text-align: center;
  }
  .home-hero-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.74rem; font-weight: 700;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.4);
    padding: 5px 13px; border-radius: 999px;
    margin-bottom: 14px;
    backdrop-filter: blur(2px);
  }
  .home-hero h1 {
    font-size: 1.55rem; color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.75), 0 2px 16px rgba(0,0,0,0.6);
    word-break: keep-all;
  }
  .home-hero p.sub {
    margin-top: 10px; font-size: 0.9rem; color: rgba(255,255,255,0.92);
    text-shadow: 0 1px 4px rgba(0,0,0,0.75), 0 2px 12px rgba(0,0,0,0.6);
    max-width: 520px; margin-inline: auto;
    word-break: keep-all;
  }
  .cat-card {
    position: relative; z-index: 2;
    max-width: 720px; margin: -22px auto 0;
    background: var(--surface);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 14px 6px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
  }
  .cat-item {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 10px 2px;
    border-radius: 10px;
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 0.74rem; font-weight: 600;
    color: var(--ink);
  }
  .cat-item .ic { width: 26px; height: 26px; }
  .cat-item:hover { background: var(--surface-2); }
  .cat-item.active { background: var(--accent-soft); color: var(--accent-strong); }
  @media (max-width: 480px) {
    .cat-card { grid-template-columns: repeat(3, 1fr); }
  }

  /* ---- notice board ---- */
  .notice-section { margin-top: 34px; }
  .notice-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .notice-item {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .notice-item .n-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .notice-item .n-title { font-weight: 700; font-size: 0.92rem; }
  .notice-item .n-date { font-size: 0.72rem; color: var(--ink-muted); white-space: nowrap; }
  .notice-item .n-body { margin-top: 6px; font-size: 0.85rem; color: var(--ink-muted); white-space: pre-wrap; }

  /* ---- floating admin/report buttons ---- */
  .fab-stack {
    position: fixed;
    right: 16px;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    z-index: 40;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-end;
  }
  .fab-btn {
    width: 58px; height: 58px;
    border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 0.62rem; font-weight: 700; line-height: 1.2;
    text-align: center;
    border: none; cursor: pointer;
    box-shadow: 0 6px 18px -6px rgba(0,0,0,0.5);
    color: #fff;
  }
  .fab-btn .ic { font-size: 1.15rem; margin-bottom: 1px; }
  .fab-btn.fab-admin { background: var(--ink); }
  .fab-btn.fab-report { background: var(--warn); }
  @media (max-width: 480px) {
    .fab-btn { width: 50px; height: 50px; font-size: 0.56rem; }
    .fab-btn .ic { font-size: 1rem; }
  }

  /* ---- lightweight modal ---- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10,14,10,0.55);
    display: none;
    align-items: center; justify-content: center;
    z-index: 55; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--surface);
    border-radius: 14px;
    max-width: 420px; width: 100%;
    padding: 20px;
    box-shadow: var(--shadow);
    max-height: 86vh;
    overflow-y: auto;
  }
  .modal-box h3 { font-size: 1.1rem; }
  .modal-box p.hint { margin-top: 6px; }
  .modal-box .field { margin-top: 12px; }
  .modal-actions { margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="#/" class="brand">
      <svg class="brand-fish" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M13 9 L17 3 L19.5 10.5 Z" fill="#3d4f5c"/>
        <path d="M27 17 L32.5 10.5 L32.5 23.5 Z" fill="#3d4f5c"/>
        <ellipse cx="16" cy="17.5" rx="12.5" ry="8.2" fill="#5b7386"/>
        <path d="M7 22.5 Q4 27 1.5 26 Q4.5 23 5.5 20 Z" fill="#e0a563"/>
        <circle cx="9.3" cy="15.5" r="4.3" fill="#f5f8fa"/>
        <circle cx="8.5" cy="15.5" r="2.7" fill="#182029"/>
        <circle cx="7.5" cy="14.3" r="0.9" fill="#ffffff"/>

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 3200);
  }
  function fmtWon(n) {
    if (n === null || n === undefined || n === "" || isNaN(n)) return "-";
    n = Number(n);
    if (n >= 10000) {
      var eok = Math.floor(n / 10000);
      var rem = n % 10000;
      return eok + "억" + (rem ? " " + rem.toLocaleString("ko-KR") + "만원" : "");
    }
    return n.toLocaleString("ko-KR") + "만원";
  }
  function lastPriceLine(b) {
    var d = b.lastDealType || "월세";
    if (d === "전세") return b.lastJeonseAmount != null ? "전세 " + fmtWon(b.lastJeonseAmount) : "";
    if (d === "매매") return b.lastSaleAmount != null ? "매매 " + fmtWon(b.lastSaleAmount) : "";
    var parts = [];
    if (b.lastRent != null) parts.push("월세 " + fmtWon(b.lastRent));
    if (b.lastDeposit != null) parts.push("보증금 " + fmtWon(b.lastDeposit));
    return parts.join(" · ");
  }

  function hashStr(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = (h << 5) - h + s.charCodeAt(i); h |= 0; }
    return Math.abs(h);
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function buildingArt(b) {
    var seed = hashStr((b.name || "") + "|" + (b.buildingType || ""));
    var rnd = mulberry32(seed);
    var pal = ART_PALETTES[b.buildingType] || ART_PALETTES["기타"];
    var w = 320, h = 180;
    var floors = 3 + Math.floor(rnd() * 4);
    var cols = 3 + Math.floor(rnd() * 3);
    var bw = 130 + Math.floor(rnd() * 70);
    var bx = (w - bw) / 2 + (rnd() * 24 - 12);
    var bh = floors * 24 + 24;
    var by = h - 34 - bh;
    var innerW = bw - 24, innerH = bh - 24;
    var winW = innerW / cols, winH = (innerH / floors) * 0.62;
    var windows = "";
    for (var r = 0; r < floors; r++) {
      for (var c = 0; c < cols; c++) {
        var lit = rnd() < 0.4;
        var wx = bx + 12 + c * winW + (winW - winW * 0.68) / 2;
        var wy = by + 14 + r * (innerH / floors);
        windows += '<rect x="' + wx.toFixed(1) + '" y="' + wy.toFixed(1) + '" width="' + (winW * 0.68).toFixed(1) + '" height="' + winH.toFixed(1) + '" rx="1.4" fill="' + (lit ? pal.lit : pal.dark) + '" opacity="' + (lit ? 1 : 0.6) + '"/>';
      }
    }
    var treeX = Math.max(18, bx - 24 + rnd() * 12);
    var treeX2 = Math.min(w - 18, bx + bw + 24 - rnd() * 12);
    return (
      '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + esc(b.name) + ' 건물 이미지" preserveAspectRatio="xMidYMax slice">' +
        '<defs><linearGradient id="sky' + seed + '" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="' + pal.skyTop + '"/><stop offset="1" stop-color="' + pal.skyBottom + '"/>' +
        "</linearGradient></defs>" +
        '<rect width="' + w + '" height="' + h + '" fill="url(#sky' + seed + ')"/>' +
        '<rect x="0" y="' + (h - 26) + '" width="' + w + '" height="26" fill="' + pal.ground + '"/>' +
        '<circle cx="' + treeX.toFixed(1) + '" cy="' + (h - 44) + '" r="13" fill="' + pal.tree + '"/><rect x="' + (treeX - 2).toFixed(1) + '" y="' + (h - 32) + '" width="4" height="14" fill="' + pal.trunk + '"/>' +
        '<circle cx="' + treeX2.toFixed(1) + '" cy="' + (h - 40) + '" r="10" fill="' + pal.tree + '" opacity="0.85"/><rect x="' + (treeX2 - 1.5).toFixed(1) + '" y="' + (h - 30) + '" width="3" height="12" fill="' + pal.trunk + '"/>' +
        '<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + bw + '" height="' + bh + '" rx="4" fill="' + pal.building + '"/>' +
        windows +
        '<rect x="' + (bx + bw / 2 - 15).toFixed(1) + '" y="' + (h - 26 - 28) + '" width="30" height="28" rx="2" fill="' + pal.door + '"/>' +
      "</svg>"
    );
  }

  function buildingMedia(b) {
    var photoUrl = (b.photoUrl && String(b.photoUrl)) || TYPE_PHOTOS[b.buildingType] || TYPE_PHOTOS["기타"];
    var fallback = "data:image/svg+xml;utf8," + encodeURIComponent(buildingArt(b));
    return (
      '<img src="' + esc(photoUrl) + '" alt="' + esc(b.name) + ' 건물 사진" loading="lazy" ' +
      "onerror=\"this.onerror=null;this.src='" + fallback.replace(/'/g, "%27") + "';\"" + " />"
    );
  }

  function fmtDate(iso) {
    if (!iso) return "-";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "-";
    return d.getFullYear() + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0");
  }
  function dbErrorMessage(e) {
    if (!e || !e.code) return "알 수 없는 오류가 발생했어요.";
    switch (e.code) {
      case "quota_exceeded": return "저장 공간이 가득 찼어요. 잠시 후 다시 시도해주세요.";
      case "invalid_argument": return "입력값을 확인해주세요.";
      case "resource_exhausted": return "요청이 많아요. 잠시 후 다시 시도해주세요.";
      case "revoked": return "접근 권한이 만료되었어요. 페이지를 새로고침해주세요.";
      case "not_granted": return "이 화면에서는 저장 기능을 사용할 수 없어요.";
      default: return "일시적인 오류가 발생했어요. 다시 시도해주세요.";
    }
  }
  function cleanup() {
    activeUnsubs.forEach(function (u) { try { u(); } catch (e) {} });
    activeUnsubs = [];
  }
  function track(unsub) { activeUnsubs.push(unsub); }

  // ---- give-to-get: unlock full detail after contributing at least one report ----
  var unlockBadgeEl = document.getElementById("unlock-badge");
  function hasContributed() {
    try { return localStorage.getItem("wolgye_contributed") === "1"; } catch (e) { return false; }
  }
  function markContributed() {
    try { localStorage.setItem("wolgye_contributed", "1"); } catch (e) {}
    updateUnlockBadge();
  }
  function updateUnlockBadge() {
    if (unlockBadgeEl) unlockBadgeEl.hidden = !hasContributed();
  }

  // ---- Google 로그인 (임대차계약서 인증용 최소 계정 기능) ----
  function signInWithGoogle() {
    var provider = new firebase.auth.GoogleAuthProvider();
    return auth.signInWithPopup(provider).catch(function (e) {
      toast("로그인에 실패했어요. 다시 시도해주세요.");
      throw e;
    });
  }
  function signOutUser() {
    auth.signOut();
  }
  function updateAuthUI() {
    var el = document.getElementById("auth-area");
    if (!el) return;
    if (currentUser) {
      el.innerHTML =
        '<span style="font-size:0.78rem;color:var(--ink-muted);margin-right:2px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle">' +
          esc(currentUser.displayName || currentUser.email) +
        "</span>" +
        '<button type="button" class="btn ghost" id="logout-btn" style="padding:6px 8px">로그아웃</button>';
      document.getElementById("logout-btn").addEventListener("click", signOutUser);
    } else {
      el.innerHTML = '<button type="button" class="btn ghost" id="login-btn-top" style="padding:6px 10px">로그인</button>';
      document.getElementById("login-btn-top").addEventListener("click", signInWithGoogle);
    }
  }

  function options(list, placeholder) {
    var html = placeholder ? '<option value="">' + esc(placeholder) + "</option>" : "";
    list.forEach(function (v) { html += '<option value="' + esc(v) + '">' + esc(v) + "</option>"; });
    return html;
  }

  // ---------------- ROUTER ----------------
  function router() {
    cleanup();
    var hash = location.hash.replace(/^#\/?/, "");
    var parts = hash.split("/").filter(Boolean);
    window.scrollTo(0, 0);
    if (parts[0] === "building" && parts[1]) renderDetail(decodeURIComponent(parts[1]));
    else if (parts[0] === "edit" && parts[1] && parts[2]) renderEditReport(decodeURIComponent(parts[1]), decodeURIComponent(parts[2]));
    else if (parts[0] === "submit") renderSubmit(parts[1] ? decodeURIComponent(parts[1]) : null);
    else if (parts[0] === "admin") renderAdmin();
    else renderHome();
  }
  window.addEventListener("hashchange", router);

  // ---------------- HOME ----------------
  var homeCache = [];
  function renderHome() {
    app.innerHTML =
      homeHeroHtml() +
      '<p class="intro" style="margin-top:22px">월계1동 <b>원룸·오피스텔·전세·매매</b> 등의 기록을 계약 전에 확인하세요. 난방비·관리비·생활조건은 익명으로 쌓입니다.</p>' +
      '<div class="search-row">' +
        '<input type="text" id="q" placeholder="건물명 또는 주소로 검색">' +
        '<select id="ftype">' + options(ROOM_TYPES, "전체 유형") + "</select>" +
        '<select id="fdeal">' + options(DEAL_TYPES, "전체 거래") + "</select>" +
      "</div>" +
      (hasContributed() ? "" :
        '<div class="banner">🔒 난방비 체감·채광·소음 같은 상세 정보는 제보 1건을 남기면 모든 건물에서 볼 수 있어요. ' +
        '<a href="#/submit" style="color:var(--accent-strong);font-weight:600">지금 제보하기 →</a></div>') +
      '<div id="list" class="b-list"></div>' +
      '<div class="notice-section">' +
        '<div class="section-h"><h3>📌 공지사항</h3></div>' +
        '<div id="notice-list" class="notice-list"></div>' +
      "</div>";

    var qInput = document.getElementById("q");
    var typeSel = document.getElementById("ftype");
    var dealSel = document.getElementById("fdeal");
    var listEl = document.getElementById("list");
    var noticeListEl = document.getElementById("notice-list");

    Array.prototype.forEach.call(document.querySelectorAll("#cat-card .cat-item"), function (btn) {
      btn.addEventListener("click", function () {
        var cat = btn.getAttribute("data-cat");
        typeSel.value = cat === "전체" ? "" : cat;
        Array.prototype.forEach.call(document.querySelectorAll("#cat-card .cat-item"), function (b2) { b2.classList.remove("active"); });
        btn.classList.add("active");
        paint();
        listEl.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
    document.querySelector('#cat-card .cat-item[data-cat="전체"]').classList.add("active");

    if (db) {
      db.collection("notices").orderBy("createdAt", "desc").limit(5).get().then(function (snap) {
        if (snap.empty) { noticeListEl.innerHTML = '<div class="empty" style="margin-top:0;padding:20px">아직 등록된 공지사항이 없어요.</div>'; return; }
        noticeListEl.innerHTML = snap.docs.map(function (d) {
          var n = d.data();
          return (
            '<div class="notice-item">' +
              '<div class="n-top"><span class="n-title">' + esc(n.title || "공지") + '</span><span class="n-date">' + esc(fmtDate(n.createdAt)) + "</span></div>" +
              '<div class="n-body">' + esc(n.body || "") + "</div>" +
            "</div>"
          );
        }).join("");
      }).catch(function () {
        noticeListEl.innerHTML = '<div class="empty" style="margin-top:0;padding:20px">공지사항을 불러오지 못했어요.</div>';
      });
    } else {
      noticeListEl.innerHTML = '<div class="empty" style="margin-top:0;padding:20px">공지사항을 불러올 수 없어요.</div>';
    }

    function paint() {
      var q = qInput.value.trim().toLowerCase();
      var t = typeSel.value;
      var dl = dealSel.value;
      var rows = homeCache.filter(function (b) {
        var okQ = !q || (b.name || "").toLowerCase().indexOf(q) > -1 || (b.address || "").toLowerCase().indexOf(q) > -1 || (b.zonecode || "").indexOf(q) > -1;
        var okT = !t || b.buildingType === t;
        var okD = !dl || (b.lastDealType || "월세") === dl;
        return okQ && okT && okD;
      });

    });

  // ---------------- DETAIL ----------------
  function renderDetail(id) {
    app.innerHTML = '<a class="back-link" href="#/">← 목록으로</a><div id="detail-body"></div>';
    var body = document.getElementById("detail-body");
    if (!db) {
      body.innerHTML = '<div class="banner">데이터를 불러올 수 없어요.</div>';
      return;
    }
    var buildingData = null;
    var reports = [];

    function paint() {
      if (!buildingData) {
        body.innerHTML = '<div class="empty">이 건물을 찾을 수 없어요.<div><a class="btn" href="#/">목록으로 돌아가기</a></div></div>';
        return;
      }
      var stats = summarize(reports);
      var unlocked = hasContributed();
      body.innerHTML =
        '<div class="b-hero">' + buildingMedia(buildingData) + "</div>" +
        '<div class="b-head">' +
          '<span class="tag">' + esc(buildingData.buildingType || "기타") + "</span>" +
          "<h2>" + esc(buildingData.name) + "</h2>" +
          '<div class="addr">' + (buildingData.zonecode ? "[" + esc(buildingData.zonecode) + "] " : "") + esc(buildingData.address || "주소 미상") + "</div>" +
        "</div>" +
        '<div class="stat-row">' +
          '<div class="stat"><div class="k">제보 수</div><div class="v">' + reports.length + "건</div></div>" +
          stats.priceTiles.map(function (t) {
            return '<div class="stat"><div class="k">' + esc(t.k) + '</div><div class="v">' + esc(t.v) + "</div></div>";
          }).join("") +
          '<div class="stat"><div class="k">평균 관리비</div><div class="v">' + fmtWon(stats.avgFee) + "</div></div>" +
          '<div class="stat"><div class="k">최근 업데이트</div><div class="v">' + esc(fmtDate(buildingData.lastReportAt)) + "</div></div>" +
        "</div>" +
        (stats.tags.length ? '<div class="chip-row" style="margin-top:14px">' + stats.tags.map(function (t) {
          return '<span class="chip ' + t.cls + '">' + esc(t.label) + "</span>";
        }).join("") + "</div>" : "") +
        '<div class="section-h"><h3>제보 목록</h3><a class="btn" href="#/submit/' + encodeURIComponent(buildingData._id) + '">이 건물에 제보하기</a></div>' +
        (!unlocked && reports.length ? lockBanner(buildingData._id) : "") +
        '<div class="r-list">' +
          (reports.length ? reports.map(function (r) { return reportCard(r, unlocked); }).join("") : '<div class="empty">아직 이 건물에 대한 제보가 없어요.</div>') +
        "</div>";
    }

    function lockBanner(buildingId) {
      return (
        '<div class="lock-banner">' +
          '<div class="lock-banner-icon">🔒</div>' +
          '<div class="lock-banner-text"><b>제보 1건이면 모든 상세 정보가 열려요.</b><br>' +
          '난방비 체감·채광·소음·특이사항 같은 자세한 기록은 이곳에 제보를 남긴 분에게만 보여드려요. 어떤 방이든 짧게 남겨도 충분해요.</div>' +
          '<a class="btn primary" href="#/submit/' + encodeURIComponent(buildingId) + '">제보하고 전체 보기</a>' +
        "</div>"
      );
    }

    function reportCard(r, unlocked) {
      var dealType = r.dealType || "월세";
      var priceLine;
      if (dealType === "전세") {
        priceLine = '<span class="k">전세금</span><span class="v">' + fmtWon(r.jeonseAmount) + "</span>";
      } else if (dealType === "매매") {
        priceLine = '<span class="k">매매가</span><span class="v">' + fmtWon(r.saleAmount) + "</span>";
      } else {
        priceLine = '<span class="k">보증금 / 월세</span><span class="v">' + fmtWon(r.deposit) + " / " + fmtWon(r.rent) + "</span>";
      }
      var unitBits = [];
      if (r.unitNumber) unitBits.push(esc(r.unitNumber));
      if (r.floor) unitBits.push(esc(r.floor));
      if (r.position && r.position !== "모르겠음") unitBits.push(esc(r.position));
      var trustBadge = "";
      if (r.verification && r.verification.status === "verified") {
        trustBadge = '<span class="tag" style="background:var(--ok-soft);color:var(--ok)">✅ 계약서 인증 완료</span>';
      } else if (r.verification && r.verification.status === "pending") {
        trustBadge = '<span class="tag" style="background:var(--surface-2);color:var(--ink-muted)">🕒 인증 대기 중</span>';
      } else if (r.residencyStatus === "퇴거 완료") {
        trustBadge = '<span class="tag" style="background:var(--ok-soft);color:var(--ok)">✅ 퇴거 후 작성</span>';
      } else if (r.residencyStatus === "거주 중") {
        trustBadge = '<span class="tag" style="background:var(--warn-soft);color:var(--warn)">거주 중 작성</span>';
      }
      var attachHtml = "";

      // deposit/rent-style headline numbers stay visible (same idea as the masked bill on the pitch page);
      // everything a resident could only know from actually living there is behind the give-to-get lock.
      var detailInner =
        (unitBits.length ? '<div style="margin-top:8px;font-size:0.86rem;color:var(--ink-muted)">' + unitBits.join(" · ") + "</div>" : "") +
        '<div class="r-grid" style="margin-top:10px">' +
          '<span class="k">난방 방식</span><span class="v">' + esc(r.heatingType || "-") + "</span>" +
          '<span class="k">난방비 체감</span><span class="v">' + esc(r.heatingFeel || "-") + (r.heatingCostNote ? " (" + esc(r.heatingCostNote) + ")" : "") + "</span>" +
        "</div>" +
        '<div class="chip-row">' +
          (r.maintenanceIncludes || []).map(function (m) { return '<span class="chip">관리비 포함: ' + esc(m) + "</span>"; }).join("") +
          chipFor("채광", r.lightLevel) + chipFor("온수", r.hotWater) + chipFor("결로·곰팡이", r.mold) + chipFor("소음", r.noise) + chipFor("주차", r.parking) +
        "</div>" +
        (r.note ? '<div class="r-note">' + esc(r.note) + "</div>" : "") +
        attachHtml;

      var detailBlock = unlocked
        ? detailInner
        : (
            '<div class="locked-wrap">' +
              '<div class="locked-blur" aria-hidden="true">' + detailInner + "</div>" +
              '<div class="lock-overlay">' +
                "<span>🔒 난방비 · 채광 · 소음 등 상세 정보</span>" +
                '<a class="btn primary" href="#/submit/' + encodeURIComponent(buildingData._id) + '">제보하고 잠금 해제</a>' +
              "</div>" +
            "</div>"
          );

      var isMine = !!(currentUser && r.authorUid && currentUser.uid === r.authorUid);
      var editLink = isMine
        ? '<a class="btn" style="padding:4px 10px;font-size:0.78rem" href="#/edit/' + encodeURIComponent(buildingData._id) + "/" + encodeURIComponent(r._id) + '">내 제보 수정</a>'
        : "";

      return (
        '<div class="r-card">' +
          '<div class="top"><span style="display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center">' +
            '<span class="tag">' + esc(dealType) + "</span>" +
            '<span class="tag" style="background:var(--surface-2);color:var(--ink-muted)">' + esc(r.roomType || "기타") + "</span>" +
            trustBadge + editLink +
          "</span><span class=\"when\">" + esc(fmtDate(r.createdAt)) + (r.livedPeriod ? " · 거주 " + esc(r.livedPeriod) : "") + "</span></div>" +
          '<div class="r-grid">' +
            priceLine +
            '<span class="k">관리비</span><span class="v">' + fmtWon(r.maintenanceFee) + "</span>" +
          "</div>" +
          detailBlock +
        "</div>"
      );
    }
    function chipFor(label, val) {
      if (!val || val === "모르겠음") return "";
      var cls = "";
      if (["문제없음", "없음", "조용함", "가능", "매우 밝음", "밝음"].indexOf(val) > -1) cls = "ok";
      if (["자주 끊김", "심함", "시끄러움", "불가능", "어두움", "매우 어두움"].indexOf(val) > -1) cls = "warn";
      return '<span class="chip ' + cls + '">' + esc(label) + ": " + esc(val) + "</span>";
    }
    function summarize(list) {
      var out = { avgFee: null, tags: [], priceTiles: [] };
      var fees = list.map(function (r) { return r.maintenanceFee; }).filter(function (n) { return typeof n === "number"; });
      if (fees.length) out.avgFee = Math.round(fees.reduce(function (a, b) { return a + b; }, 0) / fees.length);

      function avgOf(arr) { return arr.length ? Math.round(arr.reduce(function (a, b) { return a + b; }, 0) / arr.length) : null; }
      function priceTile(dealType, field, label) {
        var vals = list.filter(function (r) { return (r.dealType || "월세") === dealType; })
          .map(function (r) { return r[field]; })
          .filter(function (n) { return typeof n === "number"; });
        if (vals.length) out.priceTiles.push({ k: label + " 평균 (" + vals.length + "건)", v: fmtWon(avgOf(vals)) });
      }
      priceTile("월세", "rent", "월세");
      priceTile("전세", "jeonseAmount", "전세금");
      priceTile("매매", "saleAmount", "매매가");
      function mode(field, goodVals, warnVals) {
        var counts = {};
        list.forEach(function (r) { var v = r[field]; if (v && v !== "모르겠음") counts[v] = (counts[v] || 0) + 1; });
        var best = null, bestN = 0;
        Object.keys(counts).forEach(function (k) { if (counts[k] > bestN) { best = k; bestN = counts[k]; } });
        if (!best || list.length < 2) return;
        var cls = goodVals.indexOf(best) > -1 ? "ok" : (warnVals.indexOf(best) > -1 ? "warn" : "");
        out.tags.push({ label: best + " (" + bestN + "/" + list.length + "명)", cls: cls });
      }
      mode("residencyStatus", ["퇴거 완료"], []);
      mode("lightLevel", ["매우 밝음", "밝음"], ["어두움", "매우 어두움"]);
      mode("mold", ["없음"], ["심함"]);
      mode("hotWater", ["문제없음"], ["자주 끊김"]);
      mode("noise", ["조용함"], ["시끄러움"]);
      return out;
    }

    var bUnsub = db.doc("buildings/" + id).onSnapshot(function (snap) {
      buildingData = snap.exists ? Object.assign({ _id: id }, snap.data()) : null;
      paint();
    }, function () { buildingData = null; paint(); });
    track(bUnsub);

    var rUnsub = db.collection("buildings/" + id + "/reports").orderBy("createdAt", "desc").limit(200).onSnapshot(function (snap) {
      reports = snap.docs.map(function (d) { return Object.assign({ _id: d.id }, d.data()); });
      paint();
    }, function () { reports = []; paint(); });
    track(rUnsub);
  }

  function renderEditReport(buildingId, reportId) {
    if (!currentUser) {

      return;
    }
    app.innerHTML = '<div class="empty" style="margin-top:20px">불러오는 중...</div>';
    if (!db) { toast("지금은 불러올 수 없어요. 잠시 후 다시 시도해주세요."); return; }
    Promise.all([
      db.doc("buildings/" + buildingId).get(),
      db.doc("buildings/" + buildingId + "/reports/" + reportId).get()
    ]).then(function (res) {
      var bSnap = res[0], rSnap = res[1];
      if (!bSnap.exists || !rSnap.exists) {
        app.innerHTML = '<a class="back-link" href="#/">← 목록으로</a><div class="empty" style="margin-top:20px">제보를 찾을 수 없어요.</div>';
        return;

      var reportData = rSnap.data();
      if (!reportData.authorUid || reportData.authorUid !== currentUser.uid) {
        app.innerHTML = '<a class="back-link" href="#/">← 목록으로</a><div class="empty" style="margin-top:20px">본인이 남긴 제보만 수정할 수 있어요.</div>';
        return;
      }
      renderSubmit(buildingId, {
        buildingId: buildingId,
        reportId: reportId,
        buildingName: bSnap.data().name,
        data: reportData
      });
    }).catch(function (e) {
      app.innerHTML = '<a class="back-link" href="#/">← 목록으로</a><div class="empty" style="margin-top:20px">' + esc(dbErrorMessage(e)) + "</div>";

          '<p style="margin:8px 0 0;font-size:0.8rem;color:var(--ink-muted)">아직 거주 중인 제보는 다음 세입자를 구하려는 목적이 섞여 있을 수 있어요. 이미 퇴거하신 분의 제보라면 밝혀주시면 다른 사람이 더 믿을 수 있어요.</p>' +

        '<div class="submit-bar">' +

    document.getElementById("cancel").addEventListener("click", function () {
      location.hash = editCtx ? "#/building/" + encodeURIComponent(editCtx.buildingId) : "#/";
    });

    var existingBtn = document.getElementById("mode-existing");
    var newBtn = document.getElementById("mode-new");
    var existingPanel = document.getElementById("mode-existing-panel");
    var newPanel = document.getElementById("mode-new-panel");
    function setMode(m) {
      mode = m;
      existingBtn.classList.toggle("active", m === "existing");
      newBtn.classList.toggle("active", m === "new");
      existingPanel.style.display = m === "existing" ? "" : "none";
      newPanel.style.display = m === "new" ? "" : "none";
    }
    existingBtn.addEventListener("click", function () { setMode("existing"); });
    newBtn.addEventListener("click", function () { setMode("new"); });

    var dealTypeSel = document.getElementById("dealType");
    var priceMonthly = document.getElementById("price-monthly");
    var priceJeonse = document.getElementById("price-jeonse");
    var priceSale = document.getElementById("price-sale");
    function updatePriceFields() {
      var d = dealTypeSel.value;
      priceMonthly.style.display = d === "월세" ? "" : "none";
      priceJeonse.style.display = d === "전세" ? "" : "none";
      priceSale.style.display = d === "매매" ? "" : "none";
    }
    dealTypeSel.addEventListener("change", updatePriceFields);
    updatePriceFields();

    if (editCtx && editCtx.data) {
      (function prefillFromExisting() {
        var ed = editCtx.data;
        picked = { id: editCtx.buildingId, name: editCtx.buildingName, address: "" };
        function setVal(id, v) { var el = document.getElementById(id); if (el && v !== null && v !== undefined) el.value = v; }
        setVal("dealType", ed.dealType || "월세");
        updatePriceFields();
        setVal("roomType", ed.roomType || "");
        setVal("unitNumber", ed.unitNumber || "");
        setVal("floor", ed.floor || "");
        if (ed.deposit !== null && ed.deposit !== undefined) setVal("deposit", ed.deposit);
        if (ed.rent !== null && ed.rent !== undefined) setVal("rent", ed.rent);
        if (ed.jeonseAmount !== null && ed.jeonseAmount !== undefined) setVal("jeonseAmount", ed.jeonseAmount);
        if (ed.saleAmount !== null && ed.saleAmount !== undefined) setVal("saleAmount", ed.saleAmount);
        if (ed.maintenanceFee !== null && ed.maintenanceFee !== undefined) setVal("fee", ed.maintenanceFee);
        var incSet = ed.maintenanceIncludes || [];
        Array.prototype.forEach.call(document.querySelectorAll('input[name="inc"]'), function (cb) {
          if (incSet.indexOf(cb.value) > -1) cb.checked = true;
        });
        setVal("heatingType", ed.heatingType || "모르겠음");
        setVal("heatingFeel", ed.heatingFeel || "모르겠음");
        setVal("heatingCostNote", ed.heatingCostNote || "");
        setVal("hotWater", ed.hotWater || "모르겠음");
        setVal("position", ed.position || "모르겠음");
        setVal("lightLevel", ed.lightLevel || "모르겠음");
        setVal("mold", ed.mold || "모르겠음");
        setVal("noise", ed.noise || "모르겠음");
        setVal("parking", ed.parking || "모르겠음");
        setVal("livedPeriod", ed.livedPeriod || "");
        setVal("note", ed.note || "");
        setVal("residencyStatus", ed.residencyStatus || "");
      })();
    }

    var searchInput = document.getElementById("b-search");
    var resultsBox = document.getElementById("pick-results");
    var pickedBox = document.getElementById("picked-box");

    function renderPicked() {
      if (!picked) { pickedBox.innerHTML = ""; return; }
      pickedBox.innerHTML =
        '<div class="picked-box"><span>' + esc(picked.name) + " · " + esc(picked.address || "") + '</span><button type="button" id="unpick">변경</button></div>';
      document.getElementById("unpick").addEventListener("click", function () {
        picked = null; renderPicked(); searchInput.value = ""; searchInput.focus();
      });
    }
    function paintResults() {
      var q = searchInput.value.trim().toLowerCase();
      if (!q) { resultsBox.style.display = "none"; resultsBox.innerHTML = ""; return; }
      var rows = allBuildings.filter(function (b) {
        return (b.name || "").toLowerCase().indexOf(q) > -1 || (b.address || "").toLowerCase().indexOf(q) > -1 || (b.zonecode || "").indexOf(q) > -1;
      }).slice(0, 12);
      if (!rows.length) {
        resultsBox.style.display = "";
        resultsBox.innerHTML = '<div class="pick-item">검색 결과가 없어요. "새 건물 등록"을 이용해주세요.</div>';
        return;
      }
      resultsBox.style.display = "";
      resultsBox.innerHTML = rows.map(function (b) {
        return '<div class="pick-item" data-id="' + esc(b.id) + '"><div>' + esc(b.name) + '</div><div class="a">' + esc(b.address || "") + "</div></div>";
      }).join("");
      Array.prototype.forEach.call(resultsBox.querySelectorAll(".pick-item[data-id]"), function (el) {
        el.addEventListener("click", function () {
          var id = el.getAttribute("data-id");
          var b = allBuildings.filter(function (x) { return x.id === id; })[0];
          if (b) { picked = b; renderPicked(); searchInput.value = ""; resultsBox.style.display = "none"; }
        });
      });
    }
    searchInput.addEventListener("input", paintResults);

    // ---- 주소 검색 (다음 우편번호 서비스) ----
    var nbAddrInput = document.getElementById("nb-addr");
    var addrDupHint = document.getElementById("addr-dup-hint");
    var pickedAddr = { road: "", zonecode: "" };
    document.getElementById("addr-search-btn").addEventListener("click", function () {
      if (typeof daum === "undefined" || !daum.Postcode) {
        toast("주소 검색 서비스를 불러오지 못했어요. 인터넷 연결을 확인해주세요.");
        return;
      }
      new daum.Postcode({
        oncomplete: function (data) {
          var addr = data.roadAddress || data.jibunAddress || data.address || "";
          // 건물명이 있으면 같이 보여주고, 건물명 칸이 비어 있으면 자동으로 채워줌
          if (data.buildingName && !document.getElementById("nb-name").value.trim()) {
            document.getElementById("nb-name").value = data.buildingName;
          }
          pickedAddr = { road: addr, zonecode: data.zonecode || "" };
          nbAddrInput.value = (pickedAddr.zonecode ? "[" + pickedAddr.zonecode + "] " : "") + addr;
          checkAddrDuplicate(addr);
        }
      }).open();
    });

    function checkAddrDuplicate(addr) {
      addrDupHint.style.display = "none";
      addrDupHint.innerHTML = "";
      if (!addr || !allBuildings.length) return;
      var norm = addr.replace(/\s+/g, "");
      var matches = allBuildings.filter(function (b) {
        var ba = (b.address || "").replace(/\s+/g, "");
        return ba && (ba.indexOf(norm) > -1 || norm.indexOf(ba) > -1);
      }).slice(0, 5);
      if (!matches.length) return;
      addrDupHint.style.display = "";
      addrDupHint.innerHTML =
        "이미 같은 주소로 등록된 건물이 있어요. 아래 건물에 제보를 추가하면 정보가 한곳에 모여요:" +
        matches.map(function (b) {
          return '<button type="button" class="dup-item" data-id="' + esc(b.id) + '">' + esc(b.name) + " · " + esc(b.address || "") + "</button>";
        }).join("");
      Array.prototype.forEach.call(addrDupHint.querySelectorAll(".dup-item"), function (el) {
        el.addEventListener("click", function () {
          var id = el.getAttribute("data-id");
          var b = allBuildings.filter(function (x) { return x.id === id; })[0];
          if (b) { picked = b; renderPicked(); setMode("existing"); }
        });
      });
    }

    if (db) {
      db.collection("buildings").limit(500).get().then(function (snap) {
        allBuildings = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        if (presetId) {
          var pre = allBuildings.filter(function (b) { return b.id === presetId; })[0];
          if (pre) { picked = pre; renderPicked(); }
        }
      }).catch(function () {});
    }

    document.getElementById("f").addEventListener("submit", function (ev) {
      ev.preventDefault();
      submitReport();
    });

    function val(id) { return document.getElementById(id).value; }
    function numOrNull(id) { var v = val(id); if (v === "") return null; var n = Number(v); return isNaN(n) ? null : n; }

    function submitReport() {
      document.getElementById("err-building").style.display = "none";
      document.getElementById("err-rent").style.display = "none";

      var dealType = val("dealType") || "월세";
      var roomType = val("roomType");
      var deposit = null, rent = null, jeonseAmount = null, saleAmount = null, priceOk = false;
      if (dealType === "전세") {
        jeonseAmount = numOrNull("jeonseAmount");
        priceOk = jeonseAmount !== null;
      } else if (dealType === "매매") {
        saleAmount = numOrNull("saleAmount");
        priceOk = saleAmount !== null;
      } else {
        deposit = numOrNull("deposit"); rent = numOrNull("rent");
        priceOk = deposit !== null && rent !== null;
      }
      if (!roomType || !priceOk) {
        document.getElementById("err-rent").style.display = "";
        return;
      }
      var newName = val("nb-name").trim();
      var newAddrBase = (pickedAddr.road || "").trim();
      var newAddrDetail = val("nb-addr-detail").trim();
      var newAddr = newAddrBase + (newAddrDetail ? " (" + newAddrDetail + ")" : "");
      if (mode === "existing" && !picked) {
        document.getElementById("err-building").style.display = "";
        return;
      }
      if (mode === "new" && (!newName || !newAddrBase)) {
        document.getElementById("err-building").style.display = "";
        return;
      }
      if (!db) { toast("지금은 저장할 수 없어요. 잠시 후 다시 시도해주세요."); return; }

      var btn = document.getElementById("submitBtn");
      btn.disabled = true; btn.textContent = editCtx ? "수정 중..." : "등록 중...";

      var incs = Array.prototype.map.call(document.querySelectorAll('input[name="inc"]:checked'), function (i) { return i.value; });
      var reportData = {
        dealType: dealType,
        roomType: roomType,
        unitNumber: val("unitNumber").trim(),
        floor: val("floor").trim(),
        position: val("position") || "모르겠음",
        lightLevel: val("lightLevel") || "모르겠음",
        deposit: deposit,
        rent: rent,
        jeonseAmount: jeonseAmount,
        saleAmount: saleAmount,
        maintenanceFee: numOrNull("fee"),
        maintenanceIncludes: incs,
        heatingType: val("heatingType") || "모르겠음",
        heatingFeel: val("heatingFeel") || "모르겠음",
        heatingCostNote: val("heatingCostNote").trim(),
        hotWater: val("hotWater") || "모르겠음",
        mold: val("mold") || "모르겠음",
        noise: val("noise") || "모르겠음",
        parking: val("parking") || "모르겠음",
        livedPeriod: val("livedPeriod").trim(),
        note: val("note").trim(),
        residencyStatus: val("residencyStatus") || "모르겠음",
        contractAssetId: null,
        createdAt: new Date().toISOString()
      };

      if (!currentUser) { toast("로그인이 필요해요."); btn.disabled = false; btn.textContent = editCtx ? "수정 완료" : "제보 등록하기"; return; }

      var contractFile = (document.getElementById("contractFile").files || [])[0] || null;

      if (editCtx) {
        reportData.authorUid = editCtx.data.authorUid;
        reportData.authorEmail = editCtx.data.authorEmail;
        reportData.createdAt = editCtx.data.createdAt || reportData.createdAt;
        reportData.verification = editCtx.data.verification || null;

        var editReportRef = db.doc("buildings/" + editCtx.buildingId + "/reports/" + editCtx.reportId);
        var editChain = Promise.resolve();
        if (contractFile) {
          var editPath = "contracts/" + editCtx.reportId + "_" + Date.now();
          editChain = storage.ref().child(editPath).put(contractFile).then(function (snap) {
            return snap.ref.getDownloadURL();
          }).then(function (url) {
            reportData.verification = { status: "pending", imageUrl: url, submittedAt: new Date().toISOString() };
          }).catch(function () {
            // 업로드 실패해도 나머지 수정 내용은 저장되도록 조용히 넘어감
          });
        }
        editChain.then(function () {
          return editReportRef.update(reportData);
        }).then(function () {
          toast("제보가 수정됐어요." + (contractFile ? " 계약서는 다시 검토 후 인증돼요." : ""));
          location.hash = "#/building/" + encodeURIComponent(editCtx.buildingId);
        }).catch(function (e) {
          btn.disabled = false; btn.textContent = "수정 완료";
          toast(dbErrorMessage(e));
        });
        return;
      }

      reportData.authorUid = currentUser.uid;
      reportData.authorEmail = currentUser.email;
      reportData.verification = null;

      var buildingPromise;
      if (mode === "existing") {
        buildingPromise = Promise.resolve(picked.id);
      } else {
        buildingPromise = db.collection("buildings").add({
          name: newName,
          address: newAddr,
          roadAddress: newAddrBase,
          zonecode: pickedAddr.zonecode || "",
          buildingType: val("nb-type") || "기타",
          createdAt: new Date().toISOString(),
          lastReportAt: new Date().toISOString()
        }).then(function (ref) { return ref.id; });
      }

      buildingPromise.then(function (buildingId) {
        return db.collection("buildings/" + buildingId + "/reports").add(reportData).then(function (reportRef) {
          var chain = Promise.resolve();
          if (contractFile) {
            var path = "contracts/" + reportRef.id + "_" + Date.now();
            chain = storage.ref().child(path).put(contractFile).then(function (snap) {
              return snap.ref.getDownloadURL();
            }).then(function (url) {
              return reportRef.update({
                verification: { status: "pending", imageUrl: url, submittedAt: new Date().toISOString() }
              });
            }).catch(function () {
              // 업로드 실패해도 제보 자체는 이미 저장됐으니 조용히 넘어감(계약서 인증만 못 붙음)
            });
          }
          return chain.then(function () {
            return db.doc("buildings/" + buildingId).update({
              lastReportAt: reportData.createdAt,
              lastDealType: reportData.dealType,
              lastDeposit: reportData.deposit,
              lastRent: reportData.rent,
              lastJeonseAmount: reportData.jeonseAmount,
              lastSaleAmount: reportData.saleAmount
            }).catch(function () {});
          }).then(function () { return buildingId; });
        });
      }).then(function (buildingId) {
        markContributed();
        toast(contractFile ? "제보가 등록됐어요. 계약서는 검토 후 인증 배지가 붙어요!" : "제보가 등록되었어요. 고마워요! 이제 모든 건물의 상세 정보를 볼 수 있어요.");
        location.hash = "#/building/" + encodeURIComponent(buildingId);
      }).catch(function (e) {
        btn.disabled = false; btn.textContent = "제보 등록하기";
        toast(dbErrorMessage(e));
      });
    }
  }

  // ---------------- ADMIN (계약서 인증 검토) ----------------

      '<h2 style="font-size:1.4rem">계약서 인증 대기 목록</h2>' +

      '<div class="section-h" style="margin-top:40px"><h3>📌 공지사항 관리</h3></div>' +
      '<div class="field" style="margin-top:10px"><label class="main">제목</label><input type="text" id="notice-title" placeholder="예: 서버 점검 안내"></div>' +
      '<div class="field"><label class="main">내용</label><textarea id="notice-body" placeholder="공지 내용을 적어주세요"></textarea></div>' +

    document.getElementById("seed-btn").addEventListener("click", seedDemoData);

      btn.disabled = true;

        title: title, body: body,

      }).then(function () {
        document.getElementById("notice-title").value = "";
        document.getElementById("notice-body").value = "";
        toast("공지를 등록했어요.");
      }).catch(function (e) {
        toast("등록 실패: " + (e.message || ""));
      }).then(function () { btn.disabled = false; });
    });

    var noticeAdminListEl = document.getElementById("notice-admin-list");
    var noticeUnsub = firestore.collection("notices").orderBy("createdAt", "desc").limit(30).onSnapshot(function (snap) {
      if (snap.empty) { noticeAdminListEl.innerHTML = '<div class="empty">등록된 공지사항이 없어요.</div>'; return; }
      noticeAdminListEl.innerHTML = snap.docs.map(function (d) {
        var n = d.data();
        return (
          '<div class="r-card">' +
            '<div class="top"><span class="tag">' + esc(fmtDate(n.createdAt)) + '</span></div>' +
            '<div style="margin-top:8px;font-weight:700">' + esc(n.title || "") + "</div>" +
            '<div class="r-note" style="border-top:none;padding-top:0">' + esc(n.body || "") + "</div>" +
            '<div class="submit-bar" style="margin-top:12px"><button type="button" class="btn" data-notice-del="' + esc(d.id) + '">삭제</button></div>' +
          "</div>"
        );
      }).join("");
      Array.prototype.forEach.call(noticeAdminListEl.querySelectorAll("[data-notice-del]"), function (b) {
        b.addEventListener("click", function () {
          firestore.doc("notices/" + b.getAttribute("data-notice-del")).delete()
            .then(function () { toast("삭제했어요."); })
            .catch(function (e) { toast("삭제 실패: " + (e.message || "")); });
        });
      });
    }, function (e) {
      noticeAdminListEl.innerHTML = '<div class="banner">불러오지 못했어요: ' + esc(e.message || "") + "</div>";
    });
    track(noticeUnsub);

    var msgAdminListEl = document.getElementById("msg-admin-list");
    var msgUnsub = firestore.collection("admin_messages").orderBy("createdAt", "desc").limit(50).onSnapshot(function (snap) {
      var docs = snap.docs.filter(function (d) { return (d.data().status || "open") === "open"; });
      if (!docs.length) { msgAdminListEl.innerHTML = '<div class="empty">접수된 문의·신고가 없어요.</div>'; return; }
      msgAdminListEl.innerHTML = docs.map(function (d) {
        var m = d.data();
        var isReport = m.type === "report";
        return (
          '<div class="r-card">' +
            '<div class="top"><span class="tag" style="' + (isReport ? "background:var(--warn-soft);color:var(--warn)" : "") + '">' + (isReport ? "🚩 허위매물 신고" : "💬 문의") + '</span>' +
            '<span class="when">' + esc(fmtDate(m.createdAt)) + "</span></div>" +
            (isReport
              ? '<div style="margin-top:8px;font-weight:700">' + esc(m.target || "") + "</div><div class=\"r-note\" style=\"border-top:none;padding-top:0\">" + esc(m.reason || "") + "</div>"
              : '<div class="r-note" style="border-top:none;padding-top:0">' + esc(m.content || "") + "</div>") +
            (m.contactEmail || m.reporterEmail
              ? '<div style="margin-top:8px;font-size:0.8rem;color:var(--ink-muted)">연락처: ' + esc(m.contactEmail || m.reporterEmail) + "</div>"
              : "") +
            '<div class="submit-bar" style="margin-top:12px"><button type="button" class="btn primary" data-msg-resolve="' + esc(d.id) + '">처리 완료</button></div>' +
          "</div>"
        );
      }).join("");
      Array.prototype.forEach.call(msgAdminListEl.querySelectorAll("[data-msg-resolve]"), function (b) {
        b.addEventListener("click", function () {
          firestore.doc("admin_messages/" + b.getAttribute("data-msg-resolve")).update({ status: "resolved" })
            .then(function () { toast("처리 완료로 표시했어요."); })
            .catch(function (e) { toast("처리 실패: " + (e.message || "")); });
        });
      });
    }, function (e) {
      msgAdminListEl.innerHTML = '<div class="banner">불러오지 못했어요: ' + esc(e.message || "") + "</div>";
    });
    track(msgUnsub);

    var listEl = document.getElementById("admin-list");
    var q = firestore.collectionGroup("reports").where("verification.status", "==", "pending").limit(100);
    var unsub = q.onSnapshot(function (snap) {
      if (snap.empty) { listEl.innerHTML = '<div class="empty">대기 중인 인증 요청이 없어요.</div>'; return; }
      listEl.innerHTML = snap.docs.map(adminCard).join("");
      Array.prototype.forEach.call(listEl.querySelectorAll("[data-approve]"), function (b) {
        b.addEventListener("click", function () { reviewReport(b.getAttribute("data-path"), "verified"); });
      });
      Array.prototype.forEach.call(listEl.querySelectorAll("[data-reject]"), function (b) {
        b.addEventListener("click", function () { reviewReport(b.getAttribute("data-path"), "rejected"); });
      });
    }, function (e) {
      listEl.innerHTML = '<div class="banner">불러오지 못했어요: ' + esc(e.message || "") +
        '<br><span style="font-size:0.78rem">(콘솔에 색인 만들기 링크가 떴다면 그걸 눌러서 색인을 먼저 만들어주세요.)</span></div>';
    });
    track(unsub);

    function adminCard(doc) {
      var r = doc.data();
      var path = doc.ref.path;
      var bits = [r.unitNumber, r.floor, r.position].filter(Boolean).join(" · ");
      return (
        '<div class="r-card">' +
          '<div class="top"><span class="tag">' + esc(r.roomType || "") + '</span>' +
          '<span class="when">' + esc(r.authorEmail || "") + "</span></div>" +
          (bits ? '<div style="margin-top:8px;font-size:0.86rem;color:var(--ink-muted)">' + esc(bits) + "</div>" : "") +
          (r.verification && r.verification.imageUrl
            ? '<img src="' + esc(r.verification.imageUrl) + '" alt="계약서 사진" style="max-width:100%;border-radius:8px;margin-top:10px;border:1px solid var(--line)">'
            : '<p class="hint">첨부된 사진이 없어요.</p>') +
          '<div class="submit-bar" style="margin-top:12px">' +
            '<button type="button" class="btn" data-reject data-path="' + esc(path) + '">거부</button>' +
            '<button type="button" class="btn primary" data-approve data-path="' + esc(path) + '">승인</button>' +
          "</div>" +
        "</div>"
      );
    }
    function reviewReport(path, status) {
      firestore.doc(path).update({
        "verification.status": status,
        "verification.reviewedAt": new Date().toISOString(),
        "verification.reviewedBy": currentUser.email
      }).then(function () {
        toast(status === "verified" ? "승인했어요." : "거부했어요.");
      }).catch(function (e) { toast("처리 실패: " + (e.message || "")); });
    }
  }

  function seedDemoData() {
    var seed = window.__WOLGYE_SEED__;
    if (!seed) { toast("시드 데이터가 없어요."); return; }
    var batch = firestore.batch();
    Object.keys(seed.buildings).forEach(function (id) {
      batch.set(firestore.doc("buildings/" + id), seed.buildings[id]);
    });
    Object.keys(seed.reports).forEach(function (colPath) {
      Object.keys(seed.reports[colPath]).forEach(function (rid) {
        batch.set(firestore.doc(colPath + "/" + rid), seed.reports[colPath][rid]);
      });
    });
    batch.commit().then(function () {
      toast("시드 데이터를 넣었어요.");
    }).catch(function (e) { toast("실패: " + (e.message || "")); });
  }

  // ---------------- 문의 / 신고 (플로팅 버튼) ----------------
  function openModal(id) { var el = document.getElementById(id); if (el) el.classList.add("open"); }
  function closeModal(id) { var el = document.getElementById(id); if (el) el.classList.remove("open"); }

  document.getElementById("fab-inquiry").addEventListener("click", function () {
    document.getElementById("inquiry-contact").value = (currentUser && currentUser.email) || "";
    document.getElementById("inquiry-content").value = "";
    openModal("inquiry-modal");
  });
  document.getElementById("inquiry-cancel").addEventListener("click", function () { closeModal("inquiry-modal"); });
  document.getElementById("inquiry-modal").addEventListener("click", function (ev) {
    if (ev.target.id === "inquiry-modal") closeModal("inquiry-modal");
  });
  document.getElementById("inquiry-submit").addEventListener("click", function () {
    var content = document.getElementById("inquiry-content").value.trim();
    if (!content) { toast("내용을 입력해주세요."); return; }
    if (!db) { toast("지금은 보낼 수 없어요. 잠시 후 다시 시도해주세요."); return; }
    var btn = this;
    btn.disabled = true; btn.textContent = "보내는 중...";
    db.collection("admin_messages").add({
      type: "inquiry",
      content: content,
      contactEmail: document.getElementById("inquiry-contact").value.trim(),
      reporterUid: currentUser ? currentUser.uid : null,
      reporterEmail: currentUser ? currentUser.email : null,
      status: "open",
      createdAt: new Date().toISOString()
    }).then(function () {
      toast("문의가 접수됐어요. 관리자가 확인할게요.");
      closeModal("inquiry-modal");
    }).catch(function (e) {
      toast(dbErrorMessage(e));
    }).then(function () {
      btn.disabled = false; btn.textContent = "보내기";
    });
  });

  document.getElementById("fab-report").addEventListener("click", function () {
    document.getElementById("report-target").value = "";
    document.getElementById("report-reason").value = "";
    openModal("report-modal");
  });
  document.getElementById("report-cancel").addEventListener("click", function () { closeModal("report-modal"); });
  document.getElementById("report-modal").addEventListener("click", function (ev) {
    if (ev.target.id === "report-modal") closeModal("report-modal");
  });
  document.getElementById("report-submit").addEventListener("click", function () {
    var target = document.getElementById("report-target").value.trim();
    var reason = document.getElementById("report-reason").value.trim();
    if (!target || !reason) { toast("건물명(또는 주소)과 신고 사유를 모두 입력해주세요."); return; }
    if (!db) { toast("지금은 보낼 수 없어요. 잠시 후 다시 시도해주세요."); return; }
    var btn = this;
    btn.disabled = true; btn.textContent = "신고하는 중...";
    db.collection("admin_messages").add({
      type: "report",
      target: target,
      reason: reason,
      reporterUid: currentUser ? currentUser.uid : null,
      reporterEmail: currentUser ? currentUser.email : null,
      status: "open",
      createdAt: new Date().toISOString()
    }).then(function () {
      toast("신고가 접수됐어요. 확인 후 조치할게요.");
      closeModal("report-modal");
    }).catch(function (e) {
      toast(dbErrorMessage(e));
    }).then(function () {
      btn.disabled = false; btn.textContent = "신고하기";
    });
  });

  // ---------------- INIT ----------------
  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest(".attach-toggle");
    if (!btn) return;
    var img = btn.nextElementSibling;
    if (img) img.hidden = !img.hidden;
  });

  db = firestore;
  dbState = "ready";
  updateUnlockBadge();
  auth.onAuthStateChanged(function (user) {
    currentUser = user;
    updateAuthUI();
    router();
  });
})();
</script>
</body>
</html>
