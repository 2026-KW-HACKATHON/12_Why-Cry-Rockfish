  // ---------------- 관리자: 카카오맵 장소 검색으로 월계1동 건물 수집 ----------------
  var COLLECT_KEYWORDS = ["빌라", "원룸", "원룸텔", "오피스텔", "주택", "하우스", "맨션", "리빙텔", "빌리지", "타운", "캐슬", "팰리스", "레지던스", "스테이", "연립", "다세대", "아파트"];
  function guessType(name, cat) {
    var t = name + " " + cat;
    if (/오피스텔/.test(t)) return "오피스텔";
    if (/아파트/.test(cat)) return "아파트";
    if (/원룸|룸텔|리빙텔|고시|레지던스|스테이|하숙|기숙/.test(t)) return "원룸";
    if (/투룸/.test(t)) return "투룸";
    if (/빌라|주택|맨션|하우스|연립|다세대|빌리지|타운|캐슬|팰리스|빌$/.test(t)) return "빌라";
    return "기타";
  }
  function isHousingPlace(p) {
    var cat = p.category_name || "";
    if (/중개|분양|모델하우스|인테리어|이사|청소|수리|부동산서비스/.test(cat)) return false;
    if (/주거시설|고시원|원룸|오피스텔|기숙사|하숙/.test(cat)) return true;
    return false;
  }
  function runWolgyeCollector(btn) {
    var statusEl = document.getElementById("col-status");
    var resultEl = document.getElementById("col-result");
    btn.disabled = true;
    statusEl.textContent = "카카오맵 불러오는 중...";
    var found = {}, queries = 0;
    loadKakao().then(function (kakao) {
      var places = new kakao.maps.services.Places();
      var minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
      WOLGYE1_RING.forEach(function (p) { minLat = Math.min(minLat, p[0]); maxLat = Math.max(maxLat, p[0]); minLng = Math.min(minLng, p[1]); maxLng = Math.max(maxLng, p[1]); });
      // 경계 상자를 4x4 칸으로 나누고, 결과가 45개(카카오 한 번 검색 최대치)를 넘는 칸은 다시 4등분
      var cells = [], N = 4, dLat = (maxLat - minLat) / N, dLng = (maxLng - minLng) / N;
      for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) cells.push([minLat + i * dLat, minLng + j * dLng, minLat + (i + 1) * dLat, minLng + (j + 1) * dLng]);
      function cellTouches(c) {
        var pts = [[c[0], c[1]], [c[0], c[3]], [c[2], c[1]], [c[2], c[3]], [(c[0] + c[2]) / 2, (c[1] + c[3]) / 2]];
        if (pts.some(function (p) { return inWolgye1(p[0], p[1]); })) return true;
        return WOLGYE1_RING.some(function (p) { return p[0] >= c[0] && p[0] <= c[2] && p[1] >= c[1] && p[1] <= c[3]; });
      }
      var jobs = [];
      cells.filter(cellTouches).forEach(function (c) { COLLECT_KEYWORDS.forEach(function (k) { jobs.push({ c: c, k: k }); }); });
      function search(job, page) {
        return new Promise(function (resolve) {
          queries++;
          var c = job.c;
          var bounds = new kakao.maps.LatLngBounds(new kakao.maps.LatLng(c[0], c[1]), new kakao.maps.LatLng(c[2], c[3]));
          places.keywordSearch(job.k, function (data, status, pg) {
            resolve({ data: status === kakao.maps.services.Status.OK ? data : [], pg: pg, status: status });
          }, { bounds: bounds, page: page, size: 15 });
        });
      }
      function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
      function runJob(job) {
        return search(job, 1).then(function (res) {
          var total = res.pg ? res.pg.totalCount : 0;
          var small = (job.c[2] - job.c[0]) < 0.0012;
          if (total > 45 && !small) {
            var c = job.c, mLat = (c[0] + c[2]) / 2, mLng = (c[1] + c[3]) / 2;
            [[c[0], c[1], mLat, mLng], [c[0], mLng, mLat, c[3]], [mLat, c[1], c[2], mLng], [mLat, mLng, c[2], c[3]]]
              .filter(cellTouches).forEach(function (sc) { jobs.push({ c: sc, k: job.k }); });
            return;
          }
          var all = res.data.slice();
          var pages = res.pg ? Math.min(3, res.pg.last || 1) : 1;
          var chain = Promise.resolve();
          for (var pgN = 2; pgN <= pages; pgN++) (function (n) {
            chain = chain.then(function () { return sleep(60); }).then(function () { return search(job, n); }).then(function (r2) { all = all.concat(r2.data); });
          })(pgN);
          return chain.then(function () {
            all.forEach(function (p) {
              var lat = Number(p.y), lng = Number(p.x);
              if (!inWolgye1(lat, lng) || !isHousingPlace(p) || found[p.id]) return;
              found[p.id] = {
                kakaoId: p.id, name: p.place_name, lat: lat, lng: lng,
                roadAddress: p.road_address_name || "", jibunAddress: p.address_name || "",
                category: p.category_name || "", type: guessType(p.place_name, p.category_name || "")
              };
            });
          });
        });
      }
      var idx = 0;
      function next() {
        if (idx >= jobs.length) return Promise.resolve();
        var job = jobs[idx++];
        statusEl.textContent = "검색 중... " + idx + " / " + jobs.length + " (찾은 건물 " + Object.keys(found).length + "곳)";
        return runJob(job).then(function () { return sleep(80); }).then(next);
      }
      return next();
    }).then(function () {
      return db.collection("buildings").limit(3000).get();
    }).then(function (snap) {
      var existing = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      var norm = function (x) { return String(x || "").replace(/\s+|\(.*?\)|서울특별시|서울/g, ""); };
      var rows = Object.keys(found).map(function (k) { return found[k]; }).sort(function (a, b) { return a.name.localeCompare(b.name, "ko"); });
      rows.forEach(function (row) {
        row.exists = existing.some(function (b) {
          return b.kakaoId === row.kakaoId || b.id === "kakao_" + row.kakaoId ||
            (norm(b.name) === norm(row.name) && (norm(b.roadAddress || b.address) === norm(row.roadAddress) || norm(b.address) === norm(row.jibunAddress)));
        });
      });
      statusEl.textContent = "검색 " + queries + "번 · 월계1동 안의 주거 건물 " + rows.length + "곳을 찾았어요. 등록할 건물을 확인해주세요.";
      paintCollectResult(rows);
      btn.disabled = false;
    }).catch(function (e) {
      btn.disabled = false;
      statusEl.textContent = (e && e.message === "no-kakao-key") ? "카카오 키가 없어요." :
        "카카오맵을 불러오지 못했어요. 키가 맞는지, 카카오 개발자센터에 이 사이트 도메인을 등록했는지, [카카오맵] 사용 설정이 ON인지 확인해주세요.";
    });

    function paintCollectResult(rows) {
      var fresh = rows.filter(function (x) { return !x.exists; });
      resultEl.innerHTML =
        '<div class="adm-box">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">' +
            "<b>새로 등록할 수 있는 건물 " + fresh.length + "곳</b>" +
            '<span style="display:flex;gap:6px"><button type="button" class="btn" id="col-all">전체 선택</button><button type="button" class="btn" id="col-none">전체 해제</button></span>' +
          "</div>" +
          '<div class="col-list">' +
            rows.map(function (x, i) {
              return '<label class="col-row' + (x.exists ? " done" : "") + '">' +
                '<input type="checkbox" data-col="' + i + '"' + (x.exists ? " disabled" : (x.type === "아파트" ? "" : " checked")) + ">" +
                '<span class="col-main"><b>' + esc(x.name) + '</b> <span class="tag">' + esc(x.type) + "</span>" + (x.exists ? ' <span class="tag" style="background:var(--ok-soft);color:var(--ok)">이미 등록됨</span>' : "") +
                '<br><span class="col-addr">' + esc(x.roadAddress || x.jibunAddress) + " · " + esc((x.category.split(" > ").slice(-1)[0]) || "") + "</span></span>" +
              "</label>";
            }).join("") +
          "</div>" +
          '<p class="map-hint">아파트는 기본으로 빠져 있어요. 필요하면 직접 체크하세요. 등록된 건물은 홈 목록·지도에 "아직 제보 없음"으로 나타나요.</p>' +
          '<div class="submit-bar"><button type="button" class="btn primary" id="col-save">선택한 건물 등록</button></div>' +
        "</div>";
      var boxes = function () { return Array.prototype.slice.call(resultEl.querySelectorAll("input[data-col]:not([disabled])")); };
      document.getElementById("col-all").onclick = function () { boxes().forEach(function (b) { b.checked = true; }); };
      document.getElementById("col-none").onclick = function () { boxes().forEach(function (b) { b.checked = false; }); };
      document.getElementById("col-save").onclick = function () {
        var picks = boxes().filter(function (b) { return b.checked; }).map(function (b) { return rows[Number(b.getAttribute("data-col"))]; });
        if (!picks.length) { toast("등록할 건물을 골라주세요."); return; }
        var saveBtn = this; saveBtn.disabled = true;
        var now = new Date().toISOString();
        var chunks = [];
        for (var i = 0; i < picks.length; i += 400) chunks.push(picks.slice(i, i + 400));
        chunks.reduce(function (pr, chunk) {
          return pr.then(function () {
            var batch = db.batch();
            chunk.forEach(function (x) {
              batch.set(db.doc("buildings/kakao_" + x.kakaoId), {
                name: x.name,
                address: x.roadAddress ? x.roadAddress + (x.jibunAddress ? " (" + x.jibunAddress.replace(/^서울\s*노원구\s*/, "") + ")" : "") : x.jibunAddress,
                roadAddress: x.roadAddress || "",
                jibunAddress: x.jibunAddress || "",
                buildingType: ROOM_TYPES.indexOf(x.type) > -1 ? x.type : "기타",
                lat: x.lat, lng: x.lng,
                kakaoId: x.kakaoId, source: "kakao",
                createdAt: now, lastReportAt: null
              });
            });
            return batch.commit();
          });
        }, Promise.resolve()).then(function () {
          toast(picks.length + "곳을 등록했어요.");
          picks.forEach(function (x) { x.exists = true; });
          paintCollectResult(rows);
        }).catch(function (e) {
          saveBtn.disabled = false;
          toast("등록 실패: " + (e.message || ""));
        });
      };
    }
  }

  document.getElementById("auth-submit").addEventListener("click", function () {
    var email = document.getElementById("auth-email").value.trim();
    var pw = document.getElementById("auth-password").value;
    var name = document.getElementById("auth-name").value.trim();
    document.getElementById("auth-error").style.display = "none";
    if (!email || !pw) { authErr("이메일과 비밀번호를 입력해주세요."); return; }
    if (authMode === "signup" && !name) { authErr("이름을 입력해주세요."); return; }
    var btn = document.getElementById("auth-submit");
    btn.disabled = true;
    var task = authMode === "signup"
      ? auth.createUserWithEmailAndPassword(email, pw).then(function (cred) {
          var authUpdate = cred.user.updateProfile ? cred.user.updateProfile({ displayName: name }) : Promise.resolve();
          return authUpdate.then(function () {
            return db ? db.doc("users/" + cred.user.uid).set({ displayName: name }, { merge: true }).catch(function () {}) : null;
          });
        })
      : auth.signInWithEmailAndPassword(email, pw);
    task.then(function () {
      btn.disabled = false;
      closeModal("auth-modal");
    }).catch(function (e) {
      btn.disabled = false;
      authErr(firebaseAuthErrorMessage(e));
    });
  });
  document.getElementById("auth-forgot").addEventListener("click", function (ev) {
    ev.preventDefault();
    var email = document.getElementById("auth-email").value.trim();
    document.getElementById("auth-error").style.display = "none";
    if (!email) { authErr("비밀번호를 재설정할 이메일을 먼저 입력해주세요."); return; }
    auth.sendPasswordResetEmail(email).then(function () {
      toast("비밀번호 재설정 메일을 보냈어요. 메일함을 확인해주세요.");
      closeModal("auth-modal");
    }).catch(function (e) {
      authErr(firebaseAuthErrorMessage(e));
    });
  });

  // ---------------- INIT ----------------
  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest(".attach-toggle");
    if (!btn) return;
    var img = btn.nextElementSibling;
    if (img) img.hidden = !img.hidden;
  });

  db = firestore;
  dbState = "ready";
  updateUnlockBadge();
  auth.onAuthStateChanged(function (user) {
    currentUser = user;
    updateAuthUI();
    watchContributedState(user ? user.uid : null);
    router();
  });
})();
</script>
</body>
</html>
